    metadata: {ownerComponent: component.cmp01.aafiatak-backend, matchingProvidedInterface: component.cmp01.pi.persistence-interface}
  - id: component.cmp01.ri.whatsapp-authentication-interface
    name: WhatsApp Authentication Interface
