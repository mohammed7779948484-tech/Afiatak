    metadata: {ownerComponent: component.cmp01.platform-administration-dashboard, matchingProvidedInterface: component.cmp01.pi.aafiatak-application-interface}
  - id: component.cmp01.ri.persistence-interface
    name: Persistence Interface
    type: required_interface
    description: Persistence capability required by Aafiatak Backend.
    sourceRefs:
