modelId: aafiatak-mvp-class-diagram
version: '2.0'
elements:
- id: class.c01
  name: User
  type: class
  description: Maintain the globally unique verified human identity and authentication state.
  tags:
  - identity
  - access
  sourceRefs:
  - &id001
    source: mvp-class-diagram-final-verified-spec
    section: '4'
    line_start: 102
    line_end: 797
  - &id002
    source: aafiatak-product-specification
    section: MVP domain rules
    line_start: 1
    line_end: 1
  metadata:
    class_id: C01
    attributes:
    - '- userId'
    - '- normalizedPhone'
    - '- phoneVerifiedAt'
    - '- accountStatus'
    operations:
    - + requestOtp()
    - + verifyOtp()
    - + revokeSession()
    responsibility: Maintain the globally unique verified human identity and authentication state.
- id: class.c02
  name: Patient
  type: class
  description: Represent Patient-specific non-clinical profile data linked to one User identity.
  tags:
  - identity
  - patient
  sourceRefs:
  - *id001
  - *id002
  metadata:
    class_id: C02
    attributes:
    - '- patientId'
    - '- fullName'
    - '- basicProfileData'
    - '- active'
    operations:
    - + updateProfile()
    - + viewOwnAppointments()
    responsibility: Represent Patient-specific non-clinical profile data linked to one User identity.
- id: class.c03
  name: FacilityUser
  type: class
  description: Represent a provisioned User's role and access inside one participating Facility.
  tags:
  - identity
  - facility
  sourceRefs:
  - *id001
  - *id002
  metadata:
    class_id: C03
    attributes:
    - '- facilityUserId'
    - '- role'
    - '- status'
    - '- permissions'
    operations:
    - + assignApprovedRole()
    - + enable()
    - + disable()
    responsibility: Represent a provisioned User's role and access inside one participating Facility.
- id: class.c04
  name: PlatformRoleAssignment
  type: class
  description: Represent a controlled platform-role relationship for a User, including Platform Administrator/platform-staff
    access.
  tags:
  - identity
  - platform
  sourceRefs:
  - *id001
  - *id002
  metadata:
    class_id: C04
    attributes:
    - '- assignmentId'
    - '- role'
    - '- status'
    - '- permissions'
    operations:
    - + assignApprovedRole()
    - + enable()
    - + disable()
    responsibility: Represent a controlled platform-role relationship for a User, including Platform Administrator/platform-staff
      access.
- id: class.c05
  name: FacilityOnboardingRequest
  type: class
  description: Preserve the platform-side intake/review decision for facility onboarding.
  tags:
  - platform
  - onboarding
  sourceRefs:
  - *id001
  - *id002
  metadata:
    class_id: C05
    attributes:
    - '- requestId'
    - '- status'
    - '- submittedAt'
    - '- decisionAt'
    operations:
    - + requestAdditionalInformation()
    - + approve()
    - + reject()
    responsibility: Preserve the platform-side intake/review decision for facility onboarding.
- id: class.c06
  name: AuditRecord
  type: class
  description: Preserve auditable actor/time/reason/source information for important changes.
  tags:
  - platform
  - audit
  sourceRefs:
  - *id001
  - *id002
  metadata:
    class_id: C06
