    - '- serviceName'
    - '- amount'
    - '- currency'
    - '- estimatedDuration'
    - '- bookingPolicy'
    - '- cancellationPolicy'
    - '- cancellationWindow'
    - '- noShowPolicy'
    - '- reconfirmationEnabled'
    - '- attendanceInstructions'
    - '- active'
    operations:
    - + setAmount()
    - + setBookingPolicy()
    - + configurePolicies()
    - + activate()
    responsibility: Define the authoritative service terms used to prepare new AvailabilityRelease records.
- id: class.c17
  name: DoctorSchedule
  type: class
  description: Represent theoretical/basic Doctor working windows before digital availability is published.
  tags:
