    responsibility: Preserve auditable appointment cancellation/rescheduling history without rewriting the original record.
- id: class.c26
  name: PaymentIntent
  type: class
  description: Represent the independent full electronic payment/refund lifecycle for FULL_PAYMENT_REQUIRED.
  tags:
  - payment
  sourceRefs:
  - *id001
  - *id002
  metadata:
    class_id: C26
    attributes:
    - '- paymentIntentId'
    - '- amount'
    - '- currency'
    - '- state'
    - '- externalReference'
    - '- createdAt'
    - '- expiresAt'
    - '- idempotencyKey'
    operations:
    - + markProcessing()
    - + verifyResult()
    - + markUnderReview()
    - + startRefund()
    - + markRefunded()
    responsibility: Represent the independent full electronic payment/refund lifecycle for FULL_PAYMENT_REQUIRED.
- id: class.c27
  name: VisitInstance
  type: class
  description: Represent what actually happens operationally on the service day, separately from Appointment status.
  tags:
