  - *id002
  metadata:
    class_id: C20
    attributes:
    - '- arrivalGroupId'
    - '- sequence'
    - '- startAt'
    - '- endAt'
    - '- capacity'
    - '- held'
    - '- confirmed'
    - '- withdrawnToFacility'
    - '- /remaining'
    - '- state'
    operations:
    - + isBookable()
    - + freeze()
    - + close()
    - + calculateRemaining()
    responsibility: Represent one sequential arrival window inside an AvailabilityRelease.
- id: class.c21
  name: CapacityWithdrawal
  type: class
  description: Record the atomic one-way transfer of valid unused Aafiatak capacity to the Facility's internal schedule.
  tags:
  - availability
  sourceRefs:
  - *id001
  - *id002
  metadata:
    class_id: C21
    attributes:
    - '- withdrawalId'
    - '- quantity'
    - '- source'
    - '- reason'
    - '- occurredAt'
    operations:
    - + execute()
    responsibility: Record the atomic one-way transfer of valid unused Aafiatak capacity to the Facility's internal schedule.
- id: class.c22
  name: ReservationHold
  type: class
  description: Temporarily protect exactly one valid booking capacity unit against double booking.
  tags:
  - appointment
  - payment
  sourceRefs:
  - *id001
  - *id002
  metadata:
    class_id: C22
    attributes:
    - '- reservationHoldId'
    - '- state'
    - '- createdAt'
    - '- expiresAt'
    - '- idempotencyKey'
    operations:
    - + consume()
    - + expire()
    - + release()
    - + isActive()
    responsibility: Temporarily protect exactly one valid booking capacity unit against double booking.
- id: class.c23
  name: AvailabilityAlertSubscription
  type: class
  description: Record Patient interest in returned availability without reserving capacity or granting priority.
  tags:
  - appointment
  - alert
  sourceRefs:
  - *id001
  - *id002
  metadata:
