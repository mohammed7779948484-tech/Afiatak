- id: class.c13
  name: Department
  type: class
  description: Provide a platform reference Department that Facilities may associate with themselves.
  tags:
  - reference-data
  - facility
  sourceRefs:
  - *id001
  - *id002
  metadata:
    class_id: C13
    attributes:
    - '- departmentId'
    - '- name'
    - '- active'
    operations:
