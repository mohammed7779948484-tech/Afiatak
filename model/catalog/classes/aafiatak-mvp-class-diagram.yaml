    - + cancelByFacility()
    - + reschedule()
    - + reconfirmAttendance()
    responsibility: Represent the confirmed booking commitment and preserve its historical booking terms.
- id: class.c25
  name: AppointmentStatusHistory
  type: class
  description: Preserve auditable appointment cancellation/rescheduling history without rewriting the original record.
  tags:
  - appointment
  - audit
  sourceRefs:
  - *id001
  - *id002
  metadata:
    class_id: C25
    attributes:
