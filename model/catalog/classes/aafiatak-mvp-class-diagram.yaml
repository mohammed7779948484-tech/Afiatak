- id: class.c12
  name: FacilityBranch
  type: class
  description: Represent the branch context in which bookings, releases, and local-time rules are interpreted.
  tags:
  - facility
  sourceRefs:
  - *id001
  - *id002
  metadata:
    class_id: C12
    attributes:
    - '- branchId'
    - '- name'
    - '- address'
    - '- mapLocation'
    - '- contactNumber'
    - '- localTimeZone'
    operations:
