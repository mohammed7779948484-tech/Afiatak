- id: class.c19
  name: AvailabilityRelease
  type: class
  description: Own the bounded digital capacity allocated to Aafiatak for one branch/doctor/service/date/session.
  tags:
  - availability
  sourceRefs:
  - *id001
  - *id002
  metadata:
    class_id: C19
    attributes:
    - '- releaseId'
    - '- date'
    - '- receptionPeriod'
    - '- published'
    - '- held'
    - '- confirmed'
    - '- withdrawnToFacility'
    - '- /remaining'
    - '- amountSnapshot'
    - '- currencySnapshot'
    - '- bookingPolicySnapshot'
    - '- cancellationPolicySnapshot'
    - '- cancellationWindowSnapshot'
    - '- noShowPolicySnapshot'
    - '- state'
    - '- lastUpdatedAt'
    operations:
    - + publish()
    - + freeze()
    - + close()
    - + cancel()
    - + calculateRemaining()
    responsibility: Own the bounded digital capacity allocated to Aafiatak for one branch/doctor/service/date/session.
- id: class.c20
  name: ArrivalGroup
  type: class
  description: Represent one sequential arrival window inside an AvailabilityRelease.
  tags:
