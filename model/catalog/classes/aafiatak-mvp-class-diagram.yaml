    - + expire()
    responsibility: Record Patient interest in returned availability without reserving capacity or granting priority.
- id: class.c24
  name: Appointment
  type: class
  description: Represent the confirmed booking commitment and preserve its historical booking terms.
  tags:
  - appointment
  sourceRefs:
  - *id001
  - *id002
  metadata:
    class_id: C24
    attributes:
    - '- appointmentId'
    - '- status'
    - '- bookingNumber'
    - '- verificationToken'
    - '- confirmedAt'
    - '- amountSnapshot'
    - '- currencySnapshot'
    - '- bookingPolicySnapshot'
    - '- cancellationPolicySnapshot'
    - '- cancellationWindowSnapshot'
    - '- noShowPolicySnapshot'
    - '- arrivalWindowSnapshot'
    operations:
