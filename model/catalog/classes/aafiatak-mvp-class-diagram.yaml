  - *id002
  metadata:
    class_id: C11
    attributes:
    - '- facilityId'
    - '- name'
    - '- status'
    - '- contactNumber'
    - '- workingHours'
    operations:
    - + updateProfile()
    - + activate()
    - + suspend()
