    - '- serviceStart'
    - '- serviceEnd'
    - '- lateAccepted'
    operations:
    - + checkIn()
    - + startService()
    - + complete()
    - + markNotCompleted()
    - + markNoShow()
    - + correctCheckIn()
    responsibility: Represent what actually happens operationally on the service day, separately from Appointment status.
- id: class.c28
  name: QueueEntry
  type: class
  description: Represent the Patient's lightweight Aafiatak queue presence inside an ArrivalGroup.
  tags:
  - queue
  - visit
  sourceRefs:
  - *id001
  - *id002
  metadata:
    class_id: C28
    attributes:
    - '- queueEntryId'
    - '- status'
    - '- createdAt'
    - '- calledAt'
    - '- completedAt'
    - '- manualHandling'
    operations:
    - + call()
    - + markDone()
    - + remove()
    responsibility: Represent the Patient's lightweight Aafiatak queue presence inside an ArrivalGroup.
- id: class.c29
  name: OperationalException
  type: class
  description: Represent an unplanned post-publication/daily-operation event and require documented outcomes for affected
    appointments.
  tags:
  - exception
  sourceRefs:
  - *id001
  - *id002
  metadata:
    class_id: C29
    attributes:
    - '- operationalExceptionId'
    - '- type'
    - '- status'
    - '- openedAt'
    - '- closedAt'
    - '- reason'
    operations:
    - + open()
    - + recordAffectedAppointmentOutcome()
    - + close()
    responsibility: Represent an unplanned post-publication/daily-operation event and require documented outcomes for affected
      appointments.
- id: class.c30
  name: OperationalExceptionResolution
  type: class
  description: Preserve the documented action and outcome for one Appointment affected by one OperationalException.
  tags:
  - exception
  sourceRefs:
  - *id001
  - *id002
  metadata:
    class_id: C30
    attributes:
    - '- resolutionId'
    - '- action'
    - '- outcome'
    - '- recordedAt'
    - '- reason'
    operations:
    - + recordOutcome()
    - + updateOutcome()
    responsibility: Preserve the documented action and outcome for one Appointment affected by one OperationalException.
- id: class.note-n1
  name: Identity
  type: note
  description: One normalized verified phone identifies one User. The same User may hold multiple approved roles/profiles.
  tags:
  - uml-note
  sourceRefs:
  - &id003
    source: mvp-class-diagram-final-verified-spec
    section: '7'
    line_start: 929
    line_end: 962
  - *id002
  metadata:
    note_id: N1
    text: One normalized verified phone identifies one User. The same User may hold multiple approved roles/profiles.
- id: class.note-n2
  name: Capacity
  type: note
  description: 'remaining = published - held - confirmed - withdrawnToFacility

    published cannot increase after PUBLISHED.'
  tags:
  - uml-note
  sourceRefs:
  - *id003
  - *id002
  metadata:
    note_id: N2
    text: 'remaining = published - held - confirmed - withdrawnToFacility

      published cannot increase after PUBLISHED.'
- id: class.note-n3
  name: Arrival Groups
  type: note
  description: New holds use the earliest currently bookable ArrivalGroup. Patients do not choose an arbitrary group.
  tags:
  - uml-note
  sourceRefs:
  - *id003
  - *id002
  metadata:
    note_id: N3
    text: New holds use the earliest currently bookable ArrivalGroup. Patients do not choose an arbitrary group.
- id: class.note-n4
  name: Hold
  type: note
  description: ReservationHold protects one capacity unit and ends as CONSUMED, EXPIRED, or RELEASED. Exact default duration
    remains open.
  tags:
  - uml-note
  sourceRefs:
  - *id003
  - *id002
  metadata:
    note_id: N4
    text: ReservationHold protects one capacity unit and ends as CONSUMED, EXPIRED, or RELEASED. Exact default duration remains
      open.
- id: class.note-n5
  name: Booking Policy
  type: note
  description: ServiceOffering policy is exactly FULL_PAYMENT_REQUIRED or PAY_AT_FACILITY. No deposit/partial payment.
  tags:
  - uml-note
  sourceRefs:
  - *id003
  - *id002
  metadata:
    note_id: N5
    text: ServiceOffering policy is exactly FULL_PAYMENT_REQUIRED or PAY_AT_FACILITY. No deposit/partial payment.
- id: class.note-n6
  name: Independent Lifecycles
  type: note
  description: ReservationHold, Appointment, PaymentIntent, VisitInstance, and QueueEntry states are independent and must
    not be collapsed.
  tags:
  - uml-note
  sourceRefs:
  - *id003
  - *id002
  metadata:
    note_id: N6
    text: ReservationHold, Appointment, PaymentIntent, VisitInstance, and QueueEntry states are independent and must not be
      collapsed.
- id: class.note-n7
  name: Payment
  type: note
  description: PAY_AT_FACILITY creates no PaymentIntent. Refund is full collected amount or zero.
  tags:
  - uml-note
  sourceRefs:
  - *id003
  - *id002
  metadata:
    note_id: N7
    text: PAY_AT_FACILITY creates no PaymentIntent. Refund is full collected amount or zero.
- id: class.note-n8
  name: Late Arrival
  type: note
  description: Accepted late Patient keeps the original Appointment/ArrivalGroup and uses manual queue handling; no auto-transfer
    or re-entry.
  tags:
  - uml-note
  sourceRefs:
  - *id003
  - *id002
  metadata:
    note_id: N8
    text: Accepted late Patient keeps the original Appointment/ArrivalGroup and uses manual queue handling; no auto-transfer
      or re-entry.
- id: class.note-n9
  name: Operational Exception
  type: note
  description: OperationalException cannot close until every affected Appointment has a documented action/outcome.
  tags:
  - uml-note
  sourceRefs:
  - *id003
  - *id002
  metadata:
    note_id: N9
    text: OperationalException cannot close until every affected Appointment has a documented action/outcome.
- id: class.note-n10
  name: Scope
  type: note
  description: Aafiatak is not an HIS/EHR/cashier/accounting/full internal scheduling system and stores no clinical record
    content.
  tags:
  - uml-note
  sourceRefs:
  - *id003
  - *id002
  metadata:
    note_id: N10
    text: Aafiatak is not an HIS/EHR/cashier/accounting/full internal scheduling system and stores no clinical record content.
