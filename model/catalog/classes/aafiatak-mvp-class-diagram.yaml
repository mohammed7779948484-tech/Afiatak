    - '- action'
    - '- timestamp'
    - '- reason'
    - '- source'
    operations:
    - + recordChange()
    responsibility: Preserve auditable actor/time/reason/source information for important changes.
- id: class.c07
  name: Notification
  type: class
  description: Represent approved in-application/system notification records.
  tags:
