modelId: aafiatak-std06-visit-instance
version: '1.0'
elements:
  - {id: state.std06.initial, name: Initial, type: initial, description: Lifecycle entry pseudostate, tags: [std06, pseudostate], sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '19.4'}]}
  - {id: state.std06.created, name: CREATED, type: state, description: VisitInstance exists before valid check-in or a terminal no-show decision, tags: [std06, lifecycle-state], sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '4'}]}
  - {id: state.std06.checked-in, name: CHECKED_IN, type: state, description: Valid facility-staff check-in has been recorded, tags: [std06, lifecycle-state], sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '4'}]}
  - {id: state.std06.in-service, name: IN_SERVICE, type: state, description: Service is currently in progress, tags: [std06, lifecycle-state], sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '4'}], metadata: {do: service in progress}}
  - {id: state.std06.completed, name: COMPLETED, type: state, description: Terminal operational completion outcome, tags: [std06, lifecycle-state, terminal], sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '4'}]}
  - {id: state.std06.not-completed, name: NOT_COMPLETED, type: state, description: Terminal operational non-completion outcome, tags: [std06, lifecycle-state, terminal], sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '4'}]}
  - {id: state.std06.no-show, name: NO_SHOW, type: state, description: Terminal no-show outcome after the ArrivalGroup window ends without a valid check-in, tags: [std06, lifecycle-state, terminal], sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '4'}]}
  - {id: state.std06.final-completed, name: Final, type: final, description: Final pseudostate after operational completion, tags: [std06, pseudostate], sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '19.4'}]}
  - {id: state.std06.final-not-completed, name: Final, type: final, description: Final pseudostate after operational non-completion, tags: [std06, pseudostate], sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '19.4'}]}
  - {id: state.std06.final-no-show, name: Final, type: final, description: Final pseudostate after no-show, tags: [std06, pseudostate], sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '19.4'}]}
relations:
  - {id: relation.std06.t01, type: transition, source: state.std06.initial, target: state.std06.created, name: 'first relevant service-day operational event / create VisitInstance', sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '19.4'}], metadata: {event: first relevant service-day operational event, action: create VisitInstance}}
  - {id: relation.std06.t02, type: transition, source: state.std06.created, target: state.std06.checked-in, name: 'Reception registers arrival / record arrival and create/activate QueueEntry', sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '19.4'}], metadata: {event: Reception registers arrival, action: record arrival and create/activate QueueEntry}}
  - {id: relation.std06.t03, type: transition, source: state.std06.created, target: state.std06.checked-in, name: 'Reception accepts late arrival [NO_SHOW not recorded] / record late acceptance and manual queue handling', sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '19.4'}], metadata: {event: Reception accepts late arrival, guard: NO_SHOW not recorded, action: record late acceptance and manual queue handling}}
  - {id: relation.std06.t04, type: transition, source: state.std06.created, target: state.std06.no-show, name: 'ArrivalGroup window ends [no valid check-in] / facility staff records no-show', sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '19.4'}], metadata: {event: ArrivalGroup window ends, guard: no valid check-in, action: facility staff records no-show}}
  - {id: relation.std06.t05, type: transition, source: state.std06.checked-in, target: state.std06.in-service, name: facility staff records service start, sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '19.4'}], metadata: {event: facility staff records service start}}
  - {id: relation.std06.t06, type: transition, source: state.std06.checked-in, target: state.std06.not-completed, name: 'service cannot be completed / record non-completion', sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '19.4'}], metadata: {event: service cannot be completed, action: record non-completion}}
  - {id: relation.std06.t07, type: transition, source: state.std06.in-service, target: state.std06.completed, name: facility staff records operational completion, sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '19.4'}], metadata: {event: facility staff records operational completion}}
  - {id: relation.std06.t08, type: transition, source: state.std06.in-service, target: state.std06.not-completed, name: 'service cannot be completed / record non-completion', sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '19.4'}], metadata: {event: service cannot be completed, action: record non-completion}}
  - {id: relation.std06.t09, type: transition, source: state.std06.checked-in, target: state.std06.created, name: 'correct erroneous check-in [before service start] / remove QueueEntry and audit reason', sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '19.4'}], metadata: {event: correct erroneous check-in, guard: before service start, action: remove QueueEntry and audit reason}}
  - {id: relation.std06.t10, type: transition, source: state.std06.completed, target: state.std06.final-completed, name: completion, sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '19.4'}], metadata: {event: completion}}
  - {id: relation.std06.t11, type: transition, source: state.std06.not-completed, target: state.std06.final-not-completed, name: completion, sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '19.4'}], metadata: {event: completion}}
  - {id: relation.std06.t12, type: transition, source: state.std06.no-show, target: state.std06.final-no-show, name: completion, sourceRefs: [{source: std06-visit-instance-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '19.4'}], metadata: {event: completion}}
