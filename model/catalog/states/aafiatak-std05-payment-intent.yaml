modelId: aafiatak-std05-payment-intent
version: '1.0'
elements:
  - {id: state.std05.initial, name: Initial, type: initial, description: Lifecycle entry pseudostate, tags: [std05, pseudostate], sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '18'}]}
  - {id: state.std05.created, name: CREATED, type: state, description: Created electronic payment intent, tags: [std05, lifecycle-state], sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '4'}]}
  - {id: state.std05.processing, name: PROCESSING, type: state, description: Gateway payment processing state, tags: [std05, lifecycle-state], metadata: {do: await trusted gateway result}, sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '4'}]}
  - {id: state.std05.succeeded, name: SUCCEEDED, type: state, description: Trusted gateway success state, tags: [std05, lifecycle-state], sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '4'}]}
  - {id: state.std05.failed, name: FAILED, type: state, description: Terminal trusted gateway failure state, tags: [std05, lifecycle-state, terminal], sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '4'}]}
  - {id: state.std05.expired, name: EXPIRED, type: state, description: Terminal payment-intent expiry state, tags: [std05, lifecycle-state, terminal], sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '4'}]}
  - {id: state.std05.under-review, name: UNDER_REVIEW, type: state, description: Nonterminal reconciliation state with intentionally unspecified exits, tags: [std05, lifecycle-state], metadata: {do: await documented reconciliation}, sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '4'}]}
  - {id: state.std05.refund-pending, name: REFUND_PENDING, type: state, description: Pending full-refund state, tags: [std05, lifecycle-state], metadata: {do: await full-refund completion}, sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '4'}]}
  - {id: state.std05.refunded, name: REFUNDED, type: state, description: Terminal refunded state, tags: [std05, lifecycle-state, terminal], sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '4'}]}
  - {id: state.std05.final-failed, name: Final, type: final, description: Final pseudostate after failure, tags: [std05, pseudostate], sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '18'}]}
  - {id: state.std05.final-expired, name: Final, type: final, description: Final pseudostate after expiry, tags: [std05, pseudostate], sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '18'}]}
  - {id: state.std05.final-refunded, name: Final, type: final, description: Final pseudostate after refund, tags: [std05, pseudostate], sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '18'}]}
relations:
  - {id: relation.std05.t01, type: transition, source: state.std05.initial, target: state.std05.created, name: 'create PaymentIntent [FULL_PAYMENT_REQUIRED AND valid booking attempt]', sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '18'}], metadata: {event: create PaymentIntent, guard: FULL_PAYMENT_REQUIRED AND valid booking attempt}}
  - {id: relation.std05.t02, type: transition, source: state.std05.created, target: state.std05.processing, name: start gateway payment, sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '18'}], metadata: {event: start gateway payment}}
  - {id: relation.std05.t03, type: transition, source: state.std05.created, target: state.std05.expired, name: payment attempt expires before completion, sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '18'}], metadata: {event: payment attempt expires before completion}}
  - {id: relation.std05.t04, type: transition, source: state.std05.processing, target: state.std05.succeeded, name: trusted gateway confirms success, sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '18'}], metadata: {event: trusted gateway confirms success}}
  - {id: relation.std05.t05, type: transition, source: state.std05.processing, target: state.std05.failed, name: trusted gateway confirms failure, sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '18'}], metadata: {event: trusted gateway confirms failure}}
  - {id: relation.std05.t06, type: transition, source: state.std05.processing, target: state.std05.expired, name: payment attempt expires, sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '18'}], metadata: {event: payment attempt expires}}
  - {id: relation.std05.t07, type: transition, source: state.std05.processing, target: state.std05.under-review, name: 'payment result cannot be safely resolved / record reconciliation case', sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '18'}], metadata: {event: payment result cannot be safely resolved, action: record reconciliation case}}
  - {id: relation.std05.t08, type: transition, source: state.std05.succeeded, target: state.std05.under-review, name: 'booking completion or safe recovery remains unresolved / move payment case to review', sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '19.3'}], metadata: {event: booking completion or safe recovery remains unresolved, action: move payment case to review}}
  - {id: relation.std05.t09, type: transition, source: state.std05.succeeded, target: state.std05.refund-pending, name: 'full refund required / initiate refund', sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '19.7'}], metadata: {event: full refund required, action: initiate refund}}
  - {id: relation.std05.t10, type: transition, source: state.std05.refund-pending, target: state.std05.refunded, name: trusted refund completion, sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '19.7'}], metadata: {event: trusted refund completion}}
  - {id: relation.std05.t11, type: transition, source: state.std05.failed, target: state.std05.final-failed, name: completion, sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '18'}], metadata: {event: completion}}
  - {id: relation.std05.t12, type: transition, source: state.std05.expired, target: state.std05.final-expired, name: completion, sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '18'}], metadata: {event: completion}}
  - {id: relation.std05.t13, type: transition, source: state.std05.refunded, target: state.std05.final-refunded, name: completion, sourceRefs: [{source: std05-payment-intent-reviewed-spec, section: '5'}, {source: aafiatak-product-specification, section: '19.7'}], metadata: {event: completion}}
