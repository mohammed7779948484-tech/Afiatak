modelId: aafiatak-sd01-patient-registration-otp
version: '1.0'
elements:
  - id: actor.sd01.visitor
    name: Visitor
    type: actor
    description: Unauthenticated human who starts registration, receives WhatsApp OTP delivery, and submits approved input.
    tags: [sd01, participant, human]
    sourceRefs:
      - source: sd01-final-reviewed-spec
        section: '4'
      - source: aafiatak-product-specification
        section: '8.4, 9, 10.1'
  - id: object.sd01.patient-application
    name: Patient Application
    type: participant
    description: Application boundary that collects registration input and displays registration and verification results.
    tags: [sd01, participant, boundary]
    sourceRefs:
      - source: sd01-final-reviewed-spec
        section: '4'
      - source: aafiatak-product-specification
        section: '8.4, 9, 10.1'
  - id: object.sd01.backend
    name: Aafiatak Backend
    type: participant
    description: Implementation-neutral control participant that normalizes phone data, enforces OTP rules, and orchestrates account creation.
    tags: [sd01, participant, control]
    sourceRefs:
      - source: sd01-final-reviewed-spec
        section: '4'
      - source: aafiatak-product-specification
        section: '8.4, 9, 10.1'
  - id: object.sd01.data-store
    name: Aafiatak Data Store
    type: participant
    description: Internal data participant that checks phone uniqueness and atomically persists User and Patient records.
    tags: [sd01, participant, data]
    sourceRefs:
      - source: sd01-final-reviewed-spec
        section: '4'
      - source: aafiatak-product-specification
        section: '8.4, 9, 10.1'
  - id: object.sd01.whatsapp-provider
    name: WhatsApp Authentication Provider
    type: participant
    description: External system that performs the approved WhatsApp OTP delivery integration.
    tags: [sd01, participant, external]
    sourceRefs:
      - source: sd01-final-reviewed-spec
        section: '4'
      - source: aafiatak-product-specification
        section: '8.4, 9, 10.1'
