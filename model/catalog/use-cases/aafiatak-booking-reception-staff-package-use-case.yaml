relations:
  - id: relation.brinc-01
    type: include
    source: uc.bruc-01
    target: uc.bruc-02
    rationale: Log In always requires WhatsApp OTP verification.
    sourceRefs: &include_ref
      - {source: booking-reception-staff-reviewed-spec, section: "7", line_start: 872, line_end: 925}
      - {source: aafiatak-product-specification, section: "authentication", line_start: 350, line_end: 382}
  - id: relation.brinc-02
    type: include
    source: uc.bruc-17
    target: uc.bruc-18
    rationale: Patient check-in includes creating or activating the visit record.
    sourceRefs: *include_ref
  - id: relation.brinc-03
    type: include
    source: uc.bruc-17
    target: uc.bruc-19
    rationale: Patient check-in includes creating or activating the queue entry.
    sourceRefs: *include_ref
  - id: relation.brinc-04
    type: include
    source: uc.bruc-20
    target: uc.bruc-25
    rationale: Correcting an erroneous check-in includes removing its incorrect queue entry.
    sourceRefs: *include_ref
  - id: relation.brinc-05
    type: include
    source: uc.bruc-31
    target: uc.bruc-17
    rationale: Manual late-arrival acceptance reuses the approved patient check-in operation.
    sourceRefs: *include_ref

