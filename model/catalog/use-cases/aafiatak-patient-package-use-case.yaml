  - id: relation.pinc-01
    type: include
    source: uc.puc-01
    target: uc.puc-02
    rationale: WhatsApp OTP verification is mandatory for passwordless Patient login.
    sourceRefs: &dependency_ref
      - {source: patient-package-reviewed-spec, section: "7", line_start: 545, line_end: 597}
      - {source: aafiatak-product-specification, section: "Booking and payment scope", line_start: 800, line_end: 1199}
  - {id: relation.pinc-02, type: include, source: uc.puc-11, target: uc.puc-12, rationale: Every booking attempt requires currently valid bookable capacity., sourceRefs: *dependency_ref}
  - {id: relation.pinc-03, type: include, source: uc.puc-11, target: uc.puc-13, rationale: Every booking attempt uses the approved atomic ReservationHold., sourceRefs: *dependency_ref}
  - {id: relation.pinc-04, type: include, source: uc.puc-21, target: uc.puc-22, rationale: Trusted gateway verification is mandatory for the electronic payment outcome., sourceRefs: *dependency_ref}
  - id: relation.pext-01
    type: extend
    source: uc.puc-21
    target: uc.puc-11
    rationale: Electronic payment occurs only under the full-payment booking policy.
    metadata: {condition: "[Booking policy = FULL_PAYMENT_REQUIRED]"}
    sourceRefs: *dependency_ref
  - id: relation.pext-02
    type: extend
    source: uc.puc-15
    target: uc.puc-12
    rationale: Availability alert is offered only when suitable capacity is unavailable.
    metadata: {condition: "[No bookable capacity available]"}
    sourceRefs: *dependency_ref
