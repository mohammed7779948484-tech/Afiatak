  - id: relation.inc-01
    type: include
    source: uc.muc-03
    target: uc.muc-05
    rationale: Phone verification is mandatory for patient self-registration.
    sourceRefs: &auth_relation_refs
      - {source: aafiatak-main-use-case-execution, section: "9", line_start: 537, line_end: 587}
      - {source: aafiatak-product-specification, section: "8.4", line_start: 350, line_end: 382}
  - {id: relation.inc-02, type: include, source: uc.muc-04, target: uc.muc-05, rationale: Human-account authentication requires WhatsApp OTP verification., sourceRefs: *auth_relation_refs}
  - id: relation.inc-03
    type: include
    source: uc.muc-06
    target: uc.muc-07
    rationale: Every booking attempt requires currently bookable capacity.
    sourceRefs: &booking_relation_refs
      - {source: aafiatak-main-use-case-execution, section: "9", line_start: 559, line_end: 617}
      - {source: aafiatak-product-specification, section: "13-16", line_start: 800, line_end: 1028}
  - {id: relation.inc-04, type: include, source: uc.muc-06, target: uc.muc-08, rationale: Every booking attempt creates an atomic ReservationHold., sourceRefs: *booking_relation_refs}
  - id: relation.inc-05
    type: include
    source: uc.muc-09
    target: uc.muc-10
    rationale: Trusted gateway verification is mandatory for payment success.
    sourceRefs:
      - {source: aafiatak-main-use-case-execution, section: "9", line_start: 579, line_end: 587}
      - {source: aafiatak-product-specification, section: "18", line_start: 1122, line_end: 1199}
  - id: relation.ext-01
    type: extend
    source: uc.muc-09
    target: uc.muc-06
    rationale: Full electronic payment applies only to FULL_PAYMENT_REQUIRED bookings.
    metadata: {condition: "[Booking policy = FULL_PAYMENT_REQUIRED]"}
    sourceRefs: *booking_relation_refs
  - id: relation.ext-02
    type: extend
    source: uc.muc-11
    target: uc.muc-07
    rationale: Availability alerts are offered only when no bookable capacity exists.
    metadata: {condition: "[No bookable capacity available]"}
    sourceRefs:
      - {source: aafiatak-main-use-case-execution, section: "9", line_start: 605, line_end: 617}
      - {source: aafiatak-product-specification, section: "15", line_start: 941, line_end: 970}
