version: 2
default: edgeStyle=orthogonalEdgeStyle;rounded=1;orthogonalLoop=1;jettySize=auto;html=1
association: endArrow=none
dependency: dashed=1;endArrow=open;endFill=0
generalization: endArrow=block;endFill=0
composition: startArrow=diamondThin;startFill=1;endArrow=none
aggregation: startArrow=diamondThin;startFill=0;endArrow=none
include: dashed=1;endArrow=open;endFill=0
extend: dashed=1;endArrow=open;endFill=0
return_message: dashed=1;endArrow=open;endFill=0
label: labelBackgroundColor=none
preferences:
  style: orthogonal
  obstacle_avoidance: true
  distribute_ports: true
  preserve_semantic_direction: true
  prefer_outer_corridors: true
  prefer_fewer_bends: true
  prefer_short_routes: true
  allow_edge_crossings: false
costs:
  node_intersection: 1000
  actor_label_intersection: 900
  boundary_crossing: 800
  edge_crossing: 700
  label_overlap: 180
  shared_segment: 0.25
  bend: 240
  route_length: 1
clearance_tokens:
  connector: quality.minimum_connector_clearance
  edge_label: quality.minimum_edge_label_clearance
  corridor: use_case.routing_corridor
