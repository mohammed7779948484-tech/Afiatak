version: 2
colors:
  canvas: "#FFFFFF"
  editorial_canvas: "#FBFAF7"
  ink: "#1F2937"
  muted_ink: "#4B5563"
  border: "#64748B"
  boundary: "#243B53"
  association: "#5F7485"
  external_association: "#405F73"
  dependency: "#244E70"
  primary_fill: "#E8F0F8"
  primary_stroke: "#466A8A"
  secondary_fill: "#EEF2F6"
  secondary_stroke: "#64748B"
  accent_fill: "#F2EDE3"
  accent_stroke: "#8A7045"
  external_fill: "#F7F7F6"
  external_stroke: "#737373"
  success_fill: "#E8F2EC"
  success_stroke: "#4F7B60"
  warning_fill: "#F7F0DC"
  warning_stroke: "#927439"
  danger_fill: "#F7E8E8"
  danger_stroke: "#945454"
  qa_fill: "#FFF3CD"
  qa_stroke: "#B38600"
  access_fill: "#DCEAF7"
  access_stroke: "#4C78A8"
  patient_fill: "#F5E7C6"
  patient_stroke: "#A97832"
  facility_fill: "#DDEBDD"
  facility_stroke: "#5D8668"
  reception_fill: "#F0E1D6"
  reception_stroke: "#9A6B4F"
  doctor_fill: "#E7EDF0"
  doctor_stroke: "#56717F"
  platform_fill: "#E4E3EE"
  platform_stroke: "#6E6A8F"
  helper_fill: "#F4F5F6"
  helper_stroke: "#667784"
  shared_fill: "#E9EEF2"
  shared_stroke: "#536D7A"
  external_service_fill: "#F7F7F6"
  external_service_stroke: "#737373"
  region_fill: "#F8F7F3"
  region_stroke: "#A6A29A"
roles:
  background:
    default: canvas
    curated_editorial: editorial_canvas
  text:
    ink: ink
    muted: muted_ink
  nodes:
    boundary: {fill: none, stroke: boundary}
    actor: {fill: none, stroke: external_stroke}
    primary: {fill: primary_fill, stroke: primary_stroke}
    secondary: {fill: secondary_fill, stroke: secondary_stroke}
    accent: {fill: accent_fill, stroke: accent_stroke}
    external: {fill: external_fill, stroke: external_stroke}
    success: {fill: success_fill, stroke: success_stroke}
    warning: {fill: warning_fill, stroke: warning_stroke}
    danger: {fill: danger_fill, stroke: danger_stroke}
    functional_access: {fill: access_fill, stroke: access_stroke}
    functional_patient: {fill: patient_fill, stroke: patient_stroke}
    functional_facility: {fill: facility_fill, stroke: facility_stroke}
    functional_reception: {fill: reception_fill, stroke: reception_stroke}
    functional_doctor: {fill: doctor_fill, stroke: doctor_stroke}
    functional_platform: {fill: platform_fill, stroke: platform_stroke}
    helper: {fill: helper_fill, stroke: helper_stroke}
    shared: {fill: shared_fill, stroke: shared_stroke}
    external_service: {fill: external_service_fill, stroke: external_service_stroke}
    region: {fill: region_fill, stroke: region_stroke}
  edges:
    association: association
    external_association: external_association
    dependency: dependency
    include: dependency
    extend: dependency
    boundary: boundary
