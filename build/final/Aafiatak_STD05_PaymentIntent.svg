<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="7500" height="5303" viewBox="0 0 7500 5303" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">State Diagram — PaymentIntent Lifecycle</title><desc id="diagram-description">Lecturer-style UML State Diagram for the PaymentIntent lifecycle.</desc><defs><style>
      .page { fill:#FFFFFF; } .page-border { fill:none; stroke:#D9E2EC; stroke-width:2; }
      .page-title { font-family:Arial,sans-serif; font-size:76px; font-weight:700; fill:#132C45; }
      .state-box { fill:#F6F9FC; stroke:#163D59; stroke-width:5; } .state-divider { stroke:#9FB3C8; stroke-width:2.5; }
      .state-name { font-family:Arial,sans-serif; font-size:64px; font-weight:700; fill:#102A43; } .state-activity { font-family:Arial,sans-serif; font-size:46px; font-style:italic; fill:#274C63; }
      .initial-node { fill:#102A43; stroke:#102A43; stroke-width:4; } .final-ring { fill:#FFFFFF; stroke:#102A43; stroke-width:7; }
      .transition-line { fill:none; stroke:#102A43; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
      .label-bg { fill:#FFFFFF; opacity:.98; } .transition-text { font-family:Arial,sans-serif; font-size:44px; font-weight:600; fill:#102A43; }
    </style><marker id="state-arrow" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 15 7 L 0 14 Z" fill="#102A43" /></marker></defs><rect x="0" y="0" width="7500" height="5303" class="page" /><rect x="55" y="55" width="7390" height="5193" rx="14" class="page-border" /><text x="3750" y="185" class="page-title" text-anchor="middle">State Diagram — PaymentIntent Lifecycle</text><g aria-label="State lifecycle nodes"><g id="state.std05.initial" data-kind="initial" data-semantic-id="state.std05.initial" aria-label="Initial pseudostate"><circle cx="500" cy="2580" r="38" class="initial-node" /></g><g id="state.std05.created" data-kind="state" data-semantic-id="state.std05.created" data-state-name="CREATED" aria-label="CREATED"><rect x="1000" y="2400" width="1250" height="360" rx="34" class="state-box" /><text x="1625" y="2605" class="state-name" text-anchor="middle">CREATED</text></g><g id="state.std05.processing" data-kind="state" data-semantic-id="state.std05.processing" data-state-name="PROCESSING" aria-label="PROCESSING"><rect x="2600" y="2400" width="1250" height="360" rx="34" class="state-box" /><line x1="2660" y1="2580" x2="3790" y2="2580" class="state-divider" /><text x="3225" y="2538" class="state-name" text-anchor="middle">PROCESSING</text><text x="3225" y="2652" class="state-activity" text-anchor="middle"><tspan x="3225">do / await trusted gateway result</tspan></text></g><g id="state.std05.succeeded" data-kind="state" data-semantic-id="state.std05.succeeded" data-state-name="SUCCEEDED" aria-label="SUCCEEDED"><rect x="4300" y="1100" width="1250" height="360" rx="34" class="state-box" /><text x="4925" y="1305" class="state-name" text-anchor="middle">SUCCEEDED</text></g><g id="state.std05.failed" data-kind="state" data-semantic-id="state.std05.failed" data-state-name="FAILED" aria-label="FAILED"><rect x="4300" y="2350" width="1250" height="360" rx="34" class="state-box" /><text x="4925" y="2555" class="state-name" text-anchor="middle">FAILED</text></g><g id="state.std05.expired" data-kind="state" data-semantic-id="state.std05.expired" data-state-name="EXPIRED" aria-label="EXPIRED"><rect x="4300" y="3550" width="1250" height="360" rx="34" class="state-box" /><text x="4925" y="3755" class="state-name" text-anchor="middle">EXPIRED</text></g><g id="state.std05.under-review" data-kind="state" data-semantic-id="state.std05.under-review" data-state-name="UNDER_REVIEW" aria-label="UNDER_REVIEW"><rect x="6100" y="1100" width="1250" height="360" rx="34" class="state-box" /><line x1="6160" y1="1280" x2="7290" y2="1280" class="state-divider" /><text x="6725" y="1238" class="state-name" text-anchor="middle">UNDER_REVIEW</text><text x="6725" y="1352" class="state-activity" text-anchor="middle"><tspan x="6725">do / await documented reconciliation</tspan></text></g><g id="state.std05.refund-pending" data-kind="state" data-semantic-id="state.std05.refund-pending" data-state-name="REFUND_PENDING" aria-label="REFUND_PENDING"><rect x="4300" y="4400" width="1250" height="360" rx="34" class="state-box" /><line x1="4360" y1="4580" x2="5490" y2="4580" class="state-divider" /><text x="4925" y="4538" class="state-name" text-anchor="middle">REFUND_PENDING</text><text x="4925" y="4652" class="state-activity" text-anchor="middle"><tspan x="4925">do / await full-refund completion</tspan></text></g><g id="state.std05.refunded" data-kind="state" data-semantic-id="state.std05.refunded" data-state-name="REFUNDED" aria-label="REFUNDED"><rect x="6100" y="4400" width="1250" height="360" rx="34" class="state-box" /><text x="6725" y="4605" class="state-name" text-anchor="middle">REFUNDED</text></g><g id="state.std05.final-failed" data-kind="final" data-semantic-id="state.std05.final-failed" aria-label="Final pseudostate"><circle cx="6300" cy="2530" r="52" class="final-ring" /><circle cx="6300" cy="2530" r="29" class="initial-node" /></g><g id="state.std05.final-expired" data-kind="final" data-semantic-id="state.std05.final-expired" aria-label="Final pseudostate"><circle cx="6300" cy="3730" r="52" class="final-ring" /><circle cx="6300" cy="3730" r="29" class="initial-node" /></g><g id="state.std05.final-refunded" data-kind="final" data-semantic-id="state.std05.final-refunded" aria-label="Final pseudostate"><circle cx="6725" cy="4970" r="52" class="final-ring" /><circle cx="6725" cy="4970" r="29" class="initial-node" /></g></g><g aria-label="Labeled state transitions"><g id="relation.std05.t01" data-kind="transition" data-semantic-id="relation.std05.t01" data-source="state.std05.initial" data-target="state.std05.created" aria-label="create PaymentIntent [FULL_PAYMENT_REQUIRED AND valid booking attempt]"><polyline points="555,2580 1000,2580" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="120" y="2277" width="1300" height="226" rx="8" class="label-bg" /><text x="770" y="2323" class="transition-text" text-anchor="middle"><tspan x="770">create PaymentIntent</tspan><tspan x="770" dy="62">[FULL_PAYMENT_REQUIRED AND valid booking</tspan><tspan x="770" dy="62">attempt]</tspan></text></g></g><g id="relation.std05.t02" data-kind="transition" data-semantic-id="relation.std05.t02" data-source="state.std05.created" data-target="state.std05.processing" aria-label="start gateway payment"><polyline points="2250,2580 2600,2580" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="2043.5" y="2419" width="763" height="102" rx="8" class="label-bg" /><text x="2425" y="2465" class="transition-text" text-anchor="middle"><tspan x="2425">start gateway payment</tspan></text></g></g><g id="relation.std05.t03" data-kind="transition" data-semantic-id="relation.std05.t03" data-source="state.std05.created" data-target="state.std05.expired" aria-label="payment attempt expires before completion"><polyline points="1625,2760 1625,3730 4300,3730" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="2230" y="3569" width="1300" height="102" rx="8" class="label-bg" /><text x="2880" y="3615" class="transition-text" text-anchor="middle"><tspan x="2880">payment attempt expires before completion</tspan></text></g></g><g id="relation.std05.t04" data-kind="transition" data-semantic-id="relation.std05.t04" data-source="state.std05.processing" data-target="state.std05.succeeded" aria-label="trusted gateway confirms success"><polyline points="3225,2400 3225,1720 4300,1280" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="3177" y="1489" width="1126" height="102" rx="8" class="label-bg" /><text x="3740" y="1535" class="transition-text" text-anchor="middle"><tspan x="3740">trusted gateway confirms success</tspan></text></g></g><g id="relation.std05.t05" data-kind="transition" data-semantic-id="relation.std05.t05" data-source="state.std05.processing" data-target="state.std05.failed" aria-label="trusted gateway confirms failure"><polyline points="3850,2530 4300,2530" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="3507" y="2369" width="1126" height="102" rx="8" class="label-bg" /><text x="4070" y="2415" class="transition-text" text-anchor="middle"><tspan x="4070">trusted gateway confirms failure</tspan></text></g></g><g id="relation.std05.t06" data-kind="transition" data-semantic-id="relation.std05.t06" data-source="state.std05.processing" data-target="state.std05.expired" aria-label="payment attempt expires"><polyline points="3225,2760 3225,3730 4300,3730" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="3345.5" y="3779" width="829" height="102" rx="8" class="label-bg" /><text x="3760" y="3825" class="transition-text" text-anchor="middle"><tspan x="3760">payment attempt expires</tspan></text></g></g><g id="relation.std05.t07" data-kind="transition" data-semantic-id="relation.std05.t07" data-source="state.std05.processing" data-target="state.std05.under-review" aria-label="payment result cannot be safely resolved / record reconciliation case"><polyline points="3225,2400 3225,700 6100,700 6100,1280" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="4030" y="488" width="1300" height="164" rx="8" class="label-bg" /><text x="4680" y="534" class="transition-text" text-anchor="middle"><tspan x="4680">payment result cannot be safely resolved /</tspan><tspan x="4680" dy="62">record reconciliation case</tspan></text></g></g><g id="relation.std05.t08" data-kind="transition" data-semantic-id="relation.std05.t08" data-source="state.std05.succeeded" data-target="state.std05.under-review" aria-label="booking completion or safe recovery remains unresolved / move payment case to review"><polyline points="5550,1280 6100,1280" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="5170" y="887" width="1300" height="226" rx="8" class="label-bg" /><text x="5820" y="933" class="transition-text" text-anchor="middle"><tspan x="5820">booking completion or safe recovery</tspan><tspan x="5820" dy="62">remains unresolved / move payment case to</tspan><tspan x="5820" dy="62">review</tspan></text></g></g><g id="relation.std05.t09" data-kind="transition" data-semantic-id="relation.std05.t09" data-source="state.std05.succeeded" data-target="state.std05.refund-pending" aria-label="full refund required / initiate refund"><polyline points="4925,1460 5700,1460 5700,4300 4925,4300 4925,4400" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="5220" y="2959" width="1300" height="102" rx="8" class="label-bg" /><text x="5870" y="3005" class="transition-text" text-anchor="middle"><tspan x="5870">full refund required / initiate refund</tspan></text></g></g><g id="relation.std05.t10" data-kind="transition" data-semantic-id="relation.std05.t10" data-source="state.std05.refund-pending" data-target="state.std05.refunded" aria-label="trusted refund completion"><polyline points="5550,4580 6100,4580" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="5377.5" y="4419" width="895" height="102" rx="8" class="label-bg" /><text x="5825" y="4465" class="transition-text" text-anchor="middle"><tspan x="5825">trusted refund completion</tspan></text></g></g><g id="relation.std05.t11" data-kind="transition" data-semantic-id="relation.std05.t11" data-source="state.std05.failed" data-target="state.std05.final-failed" aria-label="completion"><polyline points="5550,2530 6248,2530" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="5660" y="2369" width="480" height="102" rx="8" class="label-bg" /><text x="5900" y="2415" class="transition-text" text-anchor="middle"><tspan x="5900">completion</tspan></text></g></g><g id="relation.std05.t12" data-kind="transition" data-semantic-id="relation.std05.t12" data-source="state.std05.expired" data-target="state.std05.final-expired" aria-label="completion"><polyline points="5550,3730 6248,3730" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="5660" y="3569" width="480" height="102" rx="8" class="label-bg" /><text x="5900" y="3615" class="transition-text" text-anchor="middle"><tspan x="5900">completion</tspan></text></g></g><g id="relation.std05.t13" data-kind="transition" data-semantic-id="relation.std05.t13" data-source="state.std05.refunded" data-target="state.std05.final-refunded" aria-label="completion"><polyline points="6725,4760 6725,4918" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="6670" y="4794" width="480" height="102" rx="8" class="label-bg" /><text x="6910" y="4840" class="transition-text" text-anchor="middle"><tspan x="6910">completion</tspan></text></g></g></g></svg>