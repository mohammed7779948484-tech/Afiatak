<svg xmlns="http://www.w3.org/2000/svg" width="6000" height="4243" viewBox="0 0 6000 4243" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">Sequence Diagram — Patient Registration &amp; WhatsApp OTP Verification</title><desc id="diagram-description">Lecturer-style UML Sequence Diagram SD-01 with five lifelines and nineteen numbered main-success interactions.</desc><defs><style>
      .page { fill:#FFFFFF; } .page-border { fill:none; stroke:#D9E2EC; stroke-width:2; }
