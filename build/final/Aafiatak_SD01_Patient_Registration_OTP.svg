10" data-sequence="10" data-style="solid-request"><line x1="600" y1="2240" x2="1800" y2="2240" class="message-line" marker-end="url(#solid-arrow)" /><rect x="1033" y="2170" width="334" height="58" rx="5" class="label-bg" /><text x="1200" y="2197" class="message-label" text-anchor="middle"><tspan x="1200">10. Submit OTP</tspan></text></g><g id="message.sd01.m11" data-kind="message" data-semantic-id="message.sd01.m11" data-sequence="11" data-style="solid-request"><line x1="1800" y1="2400" x2="3000" y2="2400" class="message-line" marker-end="url(#solid-arrow)" /><rect x="2149" y="2330" width="502" height="58" rx="5" class="label-bg" /><text x="2400" y="2357" class="message-label" text-anchor="middle"><tspan x="2400">11. Verify OTP attempt</tspan></text></g><g id="message.sd01.m12" data-kind="message" data-semantic-id="message.sd01.m12" data-sequence="12" data-style="solid-request"><path d="M 3014 2560 H 3185 V 2622 H 3014" class="message-line self-message" marker-end="url(#solid-arrow)" /><rect x="3012" y="2388" width="330" height="178" rx="5" class="label-bg" /><text x="3177" y="2415" class="message-label" text-anchor="middle"><tspan x="3177">12. Validate</tspan><tspan x="3177" dy="40">expiry,</tspan><tspan x="3177" dy="40">single-use and</tspan><tspan x="3177" dy="40">security limits</tspan></text></g><g id="message.sd01.m13" data-kind="message" data-semantic-id="message.sd01.m13" data-sequence="13" data-style="dashed-return"><line x1="3000" y1="2720" x2="1800" y2="2720" class="message-line" marker-end="url(#open-arrow)" stroke-dasharray="12 9" /><rect x="1886.5" y="2650" width="1027" height="58" rx="5" class="label-bg" /><text x="2400" y="2677" class="message-label" text-anchor="middle"><tspan x="2400">13. OTP verified; request basic Patient profile</tspan></text></g><g id="message.sd01.m14" data-kind="message" data-semantic-id="message.sd01.m14" data-sequence="14" data-style="solid-request"><line x1="600" y1="2880" x2="1800" y2="2880" class="message-line" marker-en