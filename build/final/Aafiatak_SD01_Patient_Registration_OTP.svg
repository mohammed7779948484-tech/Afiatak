ge-label" text-anchor="middle"><tspan x="2400">18. Registration confirmed</tspan></text></g><g id="message.sd01.m19" data-kind="message" data-semantic-id="message.sd01.m19" data-sequence="19" data-style="dashed-return"><line x1="1800" y1="3680" x2="600" y2="3680" class="message-line" marker-end="url(#open-arrow)" stroke-dasharray="12 9" /><rect x="760" y="3610" width="880" height="58" rx="5" class="label-bg" /><text x="1200" y="3637" class="message-label" text-anchor="middle"><tspan x="1200">19. Display Patient registration success</tspan></text></g></g></svg>