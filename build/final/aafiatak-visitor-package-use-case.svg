<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Visitor Package Use Case Diagram — Aafiatak Medical Appointment Booking System</title>
  <desc id="diagram-description">Embedded Visitor package actor with no displayed relationships.</desc>
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; fill: #243142; text-anchor: middle; }
.page-title { font-size: 28px; font-weight: 700; }
.boundary-title { font-size: 18px; font-weight: 700; text-anchor: start; }
.section-label { font-size: 14px; font-weight: 700; letter-spacing: 1.2px; text-anchor: start; text-transform: uppercase; }
.use-case-label { font-size: 15px; }
.actor-label { font-size: 14px; font-weight: 600; }
