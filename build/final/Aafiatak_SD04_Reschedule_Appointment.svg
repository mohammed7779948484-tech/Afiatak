message.sd04.m17" data-sequence="17" data-style="solid-request"><line x1="5688" y1="3140" x2="6980" y2="3140" class="message-line" marker-end="url(#solid-arrow)" /><rect x="5857" y="3059" width="954" height="68" rx="5" class="label-bg" /><text x="6334" y="3090" class="message-label" text-anchor="middle"><tspan x="6334">17. Deliver new agreed arrival details</tspan></text></g><g id="message.sd04.m18" data-kind="message" data-semantic-id="message.sd04.m18" data-sequence="18" data-style="dashed-return"><line x1="3104" y1="3285" x2="1812" y2="3285" class="message-line" marker-end="url(#open-arrow)" stroke-dasharray="13 10" /><rect x="2041" y="3204" width="834" height="68" rx="5" class="label-bg" /><text x="2458" y="3235" class="message-label" text-anchor="middle"><tspan x="2458">18. Display successful reschedule</tspan></text></g></g></svg>