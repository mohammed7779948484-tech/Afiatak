g" /><text x="3750" y="1737" class="message-label" text-anchor="middle"><tspan x="3750">8. Check same ServiceOffering, same terms and</tspan><tspan x="3750" dy="48">destination bookability</tspan></text></g><g id="message.sd04.m09" data-kind="message" data-semantic-id="message.sd04.m09" data-sequence="9" data-style="dashed-return"><line x1="4396" y1="1980" x2="3104" y2="1980" class="message-line" marker-end="url(#open-arrow)" stroke-dasharray="13 10" /><rect x="3213" y="1899" width="1074" height="68" rx="5" class="label-bg" /><text x="3750" y="1930" class="message-label" text-anchor="middle"><tspan x="3750">9. Destination valid and currently bookable</tspan></text></g><g id="message.sd04.m10" data-kind="message" data-semantic-id="message.sd04.m10" data-sequence="10" data-style="dashed-return"><line x1="3104" y1="2125" x2="1812" y2="2125" class="message-line" marker-end="url(#open-arrow)" stroke-dasharray="13 10" /><rect x="2065" y="2044" width="786" height="68" rx="5" class="label-bg" /><text x="2458" y="2075" class="message-label" text-anchor="middle"><tspan x="2458">10. Display valid proposed move</tspan></text></g><g id="message.sd04.m11" data-kind="message" data-semantic-id="message.sd04.m11" data-sequence="11" data-style="solid-request"><line x1="520" y1="2270" x2="1812" y2="2270" class="message-line" marker-end="url(#solid-arrow)" /><rect x="665" y="2189" width="1002" height="68" rx="5" class="label-bg" /><text x="1166" y="2220" class="message-label" text-anchor="middle"><tspan x="1166">11. Confirm reschedule and record reason</tspan></text></g><g id="message.sd04.m12" data-kind="message" data-semantic-id="message.sd04.m12" data-sequence="12" data-style="solid-request"><line x1="1812" y1="2415" x2="3104" y2="2415" class="message-line" marker-end="url(#solid-arrow)" /><rect x="2185" y="2334" width="546" height="68" rx="5" class="label-bg" /><text x="2458" y="2365" class="message-label" text-anchor="middle"><tspan x="2458">12. Commit reschedule</tspan></text></g