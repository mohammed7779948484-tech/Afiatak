<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="7500" height="5303" viewBox="0 0 7500 5303" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">State Diagram — QueueEntry Lifecycle</title><desc id="diagram-description">Lecturer-style UML State Diagram for the QueueEntry lifecycle.</desc><defs><style>
      .page { fill:#FFFFFF; } .page-border { fill:none; stroke:#D9E2EC; stroke-width:2; }
      .page-title { font-family:Arial,sans-serif; font-size:76px; font-weight:700; fill:#132C45; }
      .state-box { fill:#F6F9FC; stroke:#163D59; stroke-width:5; } .state-divider { stroke:#9FB3C8; stroke-width:2.5; }
      .state-name { font-family:Arial,sans-serif; font-size:64px; font-weight:700; fill:#102A43; } .state-activity { font-family:Arial,sans-serif; font-size:46px; font-style:italic; fill:#274C63; }
      .initial-node { fill:#102A43; stroke:#102A43; stroke-width:4; } .final-ring { fill:#FFFFFF; stroke:#102A43; stroke-width:7; }
      .transition-line { fill:none; stroke:#102A43; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
      .label-bg { fill:#FFFFFF; opacity:.98; } .transition-text { font-family:Arial,sans-serif; font-size:44px; font-weight:600; fill:#102A43; }
    </style><marker id="state-arrow" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 15 7 L 0 14 Z" fill="#102A43" /></marker></defs><rect x="0" y="0" width="7500" height="5303" class="page" /><rect x="55" y="55" width="7390" height="5193" rx="14" class="page-border" /><text x="3750" y="185" class="page-title" text-anchor="middle">State Diagram — QueueEntry Lifecycle</text><g aria-label="State lifecycle nodes"><g id="state.std07.initial" data-kind="initial" data-semantic-id="state.std07.initial" aria-label="Initial pseudostate"><circle cx="800" cy="2580" r="38" class="initial-node" /></g><g id="state.std07.waiting" data-kind="state" data-semantic-id="state.std07.waiting" data-state-name="WAITING" aria-label="WAITING"><rect x="1500" y="2400" width="1250" height="360" rx="34" class="state-box" /><text x="2125" y="2605" class="state-name" text-anchor="middle">WAITING</text></g><g id="state.std07.called" data-kind="state" data-semantic-id="state.std07.called" data-state-name="CALLED" aria-label="CALLED"><rect x="3400" y="2400" width="1250" height="360" rx="34" class="state-box" /><text x="4025" y="2605" class="state-name" text-anchor="middle">CALLED</text></g><g id="state.std07.done" data-kind="state" data-semantic-id="state.std07.done" data-state-name="DONE" aria-label="DONE"><rect x="5400" y="1500" width="1250" height="360" rx="34" class="state-box" /><text x="6025" y="1705" class="state-name" text-anchor="middle">DONE</text></g><g id="state.std07.removed" data-kind="state" data-semantic-id="state.std07.removed" data-state-name="REMOVED" aria-label="REMOVED"><rect x="5400" y="3400" width="1250" height="360" rx="34" class="state-box" /><text x="6025" y="3605" class="state-name" text-anchor="middle">REMOVED</text></g><g id="state.std07.final-done" data-kind="final" data-semantic-id="state.std07.final-done" aria-label="Final pseudostate"><circle cx="7050" cy="1680" r="52" class="final-ring" /><circle cx="7050" cy="1680" r="29" class="initial-node" /></g><g id="state.std07.final-removed" data-kind="final" data-semantic-id="state.std07.final-removed" aria-label="Final pseudostate"><circle cx="7050" cy="3580" r="52" class="final-ring" /><circle cx="7050" cy="3580" r="29" class="initial-node" /></g></g><g aria-label="Labeled state transitions"><g id="relation.std07.t01" data-kind="transition" data-semantic-id="relation.std07.t01" data-source="state.std07.initial" data-target="state.std07.waiting" aria-label="valid or accepted-late check-in / create or activate QueueEntry"><polyline points="855,2580 1500,2580" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="510" y="2308" width="1300" height="164" rx="8" class="label-bg" /><text x="1160" y="2354" class="transition-text" text-anchor="middle"><tspan x="1160">valid or accepted-late check-in / create</tspan><tspan x="1160" dy="62">or activate QueueEntry</tspan></text></g></g><g id="relation.std07.t02" data-kind="transition" data-semantic-id="relation.std07.t02" data-source="state.std07.waiting" data-target="state.std07.called" aria-label="call next Patient [entry currently callable]"><polyline points="2750,2580 3400,2580" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="2479" y="2388" width="1192" height="164" rx="8" class="label-bg" /><text x="3075" y="2434" class="transition-text" text-anchor="middle"><tspan x="3075">call next Patient [entry currently</tspan><tspan x="3075" dy="62">callable]</tspan></text></g></g><g id="relation.std07.t03" data-kind="transition" data-semantic-id="relation.std07.t03" data-source="state.std07.called" data-target="state.std07.done" aria-label="queue handling completed / mark entry done"><polyline points="4650,2400 4650,1680 5400,1680" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="4380" y="1484" width="1300" height="102" rx="8" class="label-bg" /><text x="5030" y="1530" class="transition-text" text-anchor="middle"><tspan x="5030">queue handling completed / mark entry done</tspan></text></g></g><g id="relation.std07.t04" data-kind="transition" data-semantic-id="relation.std07.t04" data-source="state.std07.waiting" data-target="state.std07.removed" aria-label="audited correction/removal [valid operational reason] / record reason"><polyline points="2125,2760 2125,3100 5000,3100 5000,3580 5400,3580" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="2947.5" y="2908" width="1225" height="164" rx="8" class="label-bg" /><text x="3560" y="2954" class="transition-text" text-anchor="middle"><tspan x="3560">audited correction/removal [valid</tspan><tspan x="3560" dy="62">operational reason] / record reason</tspan></text></g></g><g id="relation.std07.t05" data-kind="transition" data-semantic-id="relation.std07.t05" data-source="state.std07.called" data-target="state.std07.removed" aria-label="audited correction/removal [valid operational reason] / record reason"><polyline points="4025,2760 4025,4250 6025,4250 6025,3760" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="4412.5" y="4288" width="1225" height="164" rx="8" class="label-bg" /><text x="5025" y="4334" class="transition-text" text-anchor="middle"><tspan x="5025">audited correction/removal [valid</tspan><tspan x="5025" dy="62">operational reason] / record reason</tspan></text></g></g><g id="relation.std07.t06" data-kind="transition" data-semantic-id="relation.std07.t06" data-source="state.std07.done" data-target="state.std07.final-done" aria-label="completion"><polyline points="6650,1680 6998,1680" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="6585" y="1519" width="480" height="102" rx="8" class="label-bg" /><text x="6825" y="1565" class="transition-text" text-anchor="middle"><tspan x="6825">completion</tspan></text></g></g><g id="relation.std07