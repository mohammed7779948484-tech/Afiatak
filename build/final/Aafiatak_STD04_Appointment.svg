<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="7500" height="5303" viewBox="0 0 7500 5303" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">State Diagram — Appointment Lifecycle</title><desc id="diagram-description">Lecturer-style UML State Diagram for the Appointment lifecycle.</desc><defs><style>
      .page { fill:#FFFFFF; } .page-border { fill:none; stroke:#D9E2EC; stroke-width:2; }
      .page-title { font-family:Arial,sans-serif; font-size:76px; font-weight:700; fill:#132C45; }
      .state-box { fill:#F6F9FC; stroke:#163D59; stroke-width:5; } .state-divider { stroke:#9FB3C8; stroke-width:2.5; }
      .state-name { font-family:Arial,sans-serif; font-size:64px; font-weight:700; fill:#102A43; } .state-activity { font-family:Arial,sans-serif; font-size:46px; font-style:italic; fill:#274C63; }
      .initial-node { fill:#102A43; stroke:#102A43; stroke-width:4; } .final-ring { fill:#FFFFFF; stroke:#102A43; stroke-width:7; }
      .transition-line { fill:none; stroke:#102A43; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
      .label-bg { fill:#FFFFFF; opacity:.98; } .transition-text { font-family:Arial,sans-serif; font-size:44px; font-weight:600; fill:#102A43; }
    </style><marker id="state-arrow" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 15 7 L 0 14 Z" fill="#102A43" /></marker></defs><rect x="0" y="0" width="7500" height="5303" class="page" /><rect x="55" y="55" width="7390" height="5193" rx="14" class="page-border" /><text x="3750" y="185" class="page-title" text-anchor="middle">State Diagram — Appointment Lifecycle</text><g aria-label="State lifecycle nodes"><g id="state.std04.initial" data-kind="initial" data-semantic-id="state.std04.initial" aria-label="Initial pseudostate"><circle cx="760" cy="2480" r="38" class="initial-node" /></g><g id="state.std04.confirmed" data-kind="state" data-semantic-id="state.std04.confirmed" data-state-name="CONFIRMED" aria-label="CONFIRMED"><rect x="1600" y="2300" width="1250" height="360" rx="34" class="state-box" /><text x="2225" y="2505" class="state-name" text-anchor="middle">CONFIRMED</text></g><g id="state.std04.cancelled-patient" data-kind="state" data-semantic-id="state.std04.cancelled-patient" data-state-name="CANCELLED_BY_PATIENT" aria-label="CANCELLED_BY_PATIENT"><rect x="5000" y="1250" width="1250" height="360" rx="34" class="state-box" /><text x="5625" y="1455" class="state-name" text-anchor="middle">CANCELLED_BY_PATIENT</text></g><g id="state.std04.cancelled-facility" data-kind="state" data-semantic-id="state.std04.cancelled-facility" data-state-name="CANCELLED_BY_FACILITY" aria-label="CANCELLED_BY_FACILITY"><rect x="5000" y="3400" width="1250" height="360" rx="34" class="state-box" /><text x="5625" y="3605" class="state-name" text-anchor="middle">CANCELLED_BY_FACILITY</text></g><g id="state.std04.final-patient" data-kind="final" data-semantic-id="state.std04.final-patient" aria-label="Final pseudostate"><circle cx="6950" cy="1430" r="52" class="final-ring" /><circle cx="6950" cy="1430" r="29" class="initial-node" /></g><g id="state.std04.final-facility" data-kind="final" data-semantic-id="state.std04.final-facility" aria-label="Final pseudostate"><circle cx="6950" cy="3580" r="52" class="final-ring" /><circle cx="6950" cy="3580" r="29" class="initial-node" /></g></g><g aria-label="Labeled state transitions"><g id="relation.std04.t01" data-kind="transition" data-semantic-id="relation.std04.t01" data-source="state.std04.initial" data-target="state.std04.confirmed" aria-label="booking requirements satisfied / create Appointment with immutable booking snapshot"><polyline points="815,2480 1600,2480" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="530" y="2007" width="1300" height="226" rx="8" class="label-bg" /><text x="1180" y="2053" class="transition-text" text-anchor="middle"><tspan x="1180">booking requirements satisfied / create</tspan><tspan x="1180" dy="62">Appointment with immutable booking</tspan><tspan x="1180" dy="62">snapshot</tspan></text></g></g><g id="relation.std04.t02" data-kind="transition" data-semantic-id="relation.std04.t02" data-source="state.std04.confirmed" data-target="state.std04.cancelled-patient" aria-label="Patient cancels [not checked in &amp; group window not started] / preserve history and release same-group capacity when eligible"><polyline points="2850,2410 3300,2410 3300,1430 5000,1430" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="3450" y="1007" width="1300" height="226" rx="8" class="label-bg" /><text x="4100" y="1053" class="transition-text" text-anchor="middle"><tspan x="4100">Patient cancels [not checked in &amp; group</tspan><tspan x="4100" dy="62">window not started] / preserve history and</tspan><tspan x="4100" dy="62">release same-group capacity when eligible</tspan></text></g></g><g id="relation.std04.t03" data-kind="transition" data-semantic-id="relation.std04.t03" data-source="state.std04.confirmed" data-target="state.std04.cancelled-facility" aria-label="Facility cancels [operationally required] / preserve history and start full refund if paid"><polyline points="2850,2550 3300,2550 3300,3580 5000,3580" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="3450" y="3177" width="1300" height="226" rx="8" class="label-bg" /><text x="4100" y="3223" class="transition-text" text-anchor="middle"><tspan x="4100">Facility cancels [operationally required]</tspan><tspan x="4100" dy="62">/ preserve history and start full refund</tspan><tspan x="4100" dy="62">if paid</tspan></text></g></g><g id="relation.std04.t04" data-kind="transition" data-semantic-id="relation.std04.t04" data-source="state.std04.cancelled-patient" data-target="state.std04.final-patient" aria-label="completion"><polyline points="6250,1430 6898,1430" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="6335" y="1269" width="480" height="102" rx="8" class="label-bg" /><text x="6575" y="1315" class="transition-text" text-anchor="middle"><tspan x="6575">completion</tspan></text></g></g><g id="relation.std04.t05" data-kind="transition" data-semantic-id="relation.std04.t05" data-source="state.std04.cancelled-facility" data-target="state.std04.final-facility" aria-label="completion"><polyline points="6250,3580 6898,3580" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="6335" y="3419" width="480" height="102" rx="8" class="label-bg" /><text x="6575" y="3465" class="transition-text" text-anchor="middle"><tspan x="6575">completion</tspan></text></g></g></g></svg>