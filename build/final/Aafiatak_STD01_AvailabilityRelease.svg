<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="7500" height="5303" viewBox="0 0 7500 5303" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">State Diagram — AvailabilityRelease Lifecycle</title><desc id="diagram-description">Lecturer-style UML State Diagram for the AvailabilityRelease lifecycle.</desc><defs><style>
