<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="7500" height="5303" viewBox="0 0 7500 5303" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">State Diagram — ArrivalGroup Lifecycle</title><desc id="diagram-description">Lecturer-style UML State Diagram for the ArrivalGroup lifecycle.</desc><defs><style>
      .page { fill:#FFFFFF; } .page-border { fill:none; stroke:#D9E2EC; stroke-width:2; }
      .page-title { font-family:Arial,sans-serif; font-size:76px; font-weight:700; fill:#132C45; }
      .state-box { fill:#F6F9FC; stroke:#163D59; stroke-width:5; } .state-divider { stroke:#9FB3C8; stroke-width:2.5; }
      .state-name { font-family:Arial,sans-serif; font-size:64px; font-weight:700; fill:#102A43; } .state-activity { font-family:Arial,sans-serif; font-size:46px; font-style:italic; fill:#274C63; }
      .initial-node { fill:#102A43; stroke:#102A43; stroke-width:4; } .final-ring { fill:#FFFFFF; stroke:#102A43; stroke-width:7; }
      .transition-line { fill:none; stroke:#102A43; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
      .label-bg { fill:#FFFFFF; opacity:.98; } .transition-text { font-family:Arial,sans-serif; font-size:44px; font-weight:600; fill:#102A43; }
    </style><marker id="state-arrow" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 15 7 L 0 14 Z" fill="#102A43" /></marker></defs><rect x="0" y="0" width="7500" height="5303" class="page" /><rect x="55" y="55" width="7390" height="5193" rx="14" class="page-border" /><text x="3750" y="185" class="page-title" text-anchor="middle">State Diagram — ArrivalGroup Lifecycle</text><g aria-label="State lifecycle nodes"><g id="state.std02.initial" data-kind="initial" data-semantic-id="state.std02.initial" aria-label="Initial pseudostate"><circle cx="900" cy="1980" r="38" class="initial-node" /></g><g id="state.std02.open" data-kind="state" data-semantic-id="state.std02.open" data-state-name="OPEN" aria-label="OPEN"><rect x="1750" y="1800" width="1250" height="360" rx="34" class="state-box" /><text x="2375" y="2005" class="state-name" text-anchor="middle">OPEN</text></g><g id="state.std02.frozen" data-kind="state" data-semantic-id="state.std02.frozen" data-state-name="FROZEN" aria-label="FROZEN"><rect x="3600" y="3100" width="1250" height="360" rx="34" class="state-box" /><text x="4225" y="3305" class="state-name" text-anchor="middle">FROZEN</text></g><g id="state.std02.closed" data-kind="state" data-semantic-id="state.std02.closed" data-state-name="CLOSED" aria-label="CLOSED"><rect x="5500" y="1800" width="1250" height="360" rx="34" class="state-box" /><text x="6125" y="2005" class="state-name" text-anchor="middle">CLOSED</text></g><g id="state.std02.final" data-kind="final" data-semantic-id="state.std02.final" aria-label="Final pseudostate"><circle cx="7050" cy="1980" r="52" class="final-ring" /><circle cx="7050" cy="1980" r="29" class="initial-node" /></g></g><g aria-label="Labeled state transitions"><g id="relation.std02.t01" data-kind="transition" data-semantic-id="relation.std02.t01" data-source="state.std02.initial" data-target="state.std02.open" aria-label="completion"><polyline points="955,1980 1750,1980" class="transition-line" marker-end="url(#state-arrow)" /></g><g id="relation.std02.t02" data-kind="transition" data-semantic-id="relation.std02.t02" data-source="state.std02.open" data-target="state.std02.frozen" aria-label="freeze group"><polyline points="2375,2160 2375,2650 4225,2650 4225,3100" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="3070" y="2489" width="480" height="102" rx="8" class="label-bg" /><text x="3310" y="2535" class="transition-text" text-anchor="middle"><tspan x="3310">freeze group</tspan></text></g></g><g id="relation.std02.t03" data-kind="transition" data-semantic-id="relation.std02.t03" data-source="state.std02.frozen" data-target="state.std02.open" aria-label="resume group"><polyline points="3600,3280 3000,3280 3000,1620 2375,1620 2375,1800" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="2530" y="2409" width="480" height="102" rx="8" class="label-bg" /><text x="2770" y="2455" class="transition-text" text-anchor="middle"><tspan x="2770">resume group</tspan></text></g></g><g id="relation.std02.t04" data-kind="transition" data-semantic-id="relation.std02.t04" data-source="state.std02.open" data-target="state.std02.closed" aria-label="close group"><polyline points="3000,1980 5500,1980" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="4010" y="1819" width="480" height="102" rx="8" class="label-bg" /><text x="4250" y="1865" class="transition-text" text-anchor="middle"><tspan x="4250">close group</tspan></text></g></g><g id="relation.std02.t05" data-kind="transition" data-semantic-id="relation.std02.t05" data-source="state.std02.frozen" data-target="state.std02.closed" aria-label="close group"><polyline points="4850,3280 5100,3280 5100,1980 5500,1980" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="5020" y="2599" width="480" height="102" rx="8" class="label-bg" /><text x="5260" y="2645" class="transition-text" text-anchor="middle"><tspan x="5260">close group</tspan></text></g></g><g id="relation.std02.t06" data-kind="transition" data-semantic-id="relation.std02.t06" data-source="state.std02.closed" data-target="state.std02.final" aria-label="completion"><polyline points="6750,1980 6998,1980" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="6630" y="1819" width="480" height="102" rx="8" class="label-bg" /><text x="6870" y="1865" class="transition-text" text-anchor="middle"><tspan x="6870">completion</tspan></text></g></g></g></svg>