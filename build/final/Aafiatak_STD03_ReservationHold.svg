<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="7500" height="5303" viewBox="0 0 7500 5303" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">State Diagram — ReservationHold Lifecycle</title><desc id="diagram-description">Lecturer-style UML State Diagram for the ReservationHold lifecycle.</desc><defs><style>
      .page { fill:#FFFFFF; } .page-border { fill:none; stroke:#D9E2EC; stroke-width:2; }
      .page-title { font-family:Arial,sans-serif; font-size:76px; font-weight:700; fill:#132C45; }
      .state-box { fill:#F6F9FC; stroke:#163D59; stroke-width:5; } .state-divider { stroke:#9FB3C8; stroke-width:2.5; }
      .state-name { font-family:Arial,sans-serif; font-size:64px; font-weight:700; fill:#102A43; } .state-activity { font-family:Arial,sans-serif; font-size:46px; font-style:italic; fill:#274C63; }
      .initial-node { fill:#102A43; stroke:#102A43; stroke-width:4; } .final-ring { fill:#FFFFFF; stroke:#102A43; stroke-width:7; }
      .transition-line { fill:none; stroke:#102A43; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
      .label-bg { fill:#FFFFFF; opacity:.98; } .transition-text { font-family:Arial,sans-serif; font-size:44px; font-weight:600; fill:#102A43; }
    </style><marker id="state-arrow" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 15 7 L 0 14 Z" fill="#102A43" /></marker></defs><rect x="0" y="0" width="7500" height="5303" class="page" /><rect x="55" y="55" width="7390" height="5193" rx="14" class="page-border" /><text x="3750" y="185" class="page-title" text-anchor="middle">State Diagram — ReservationHold Lifecycle</text><g aria-label="State lifecycle nodes"><g id="state.std03.initial" data-kind="initial" data-semantic-id="state.std03.initial" aria-label="Initial pseudostate"><circle cx="720" cy="2480" r="38" class="initial-node" /></g><g id="state.std03.active" data-kind="state" data-semantic-id="state.std03.active" data-state-name="ACTIVE" aria-label="ACTIVE"><rect x="1500" y="2300" width="1250" height="360" rx="34" class="state-box" /><line x1="1560" y1="2480" x2="2690" y2="2480" class="state-divider" /><text x="2125" y="2438" class="state-name" text-anchor="middle">ACTIVE</text><text x="2125" y="2552" class="state-activity" text-anchor="middle"><tspan x="2125">do / protect one capacity unit and</tspan><tspan x="2125" dy="46">maintain countdown</tspan></text></g><g id="state.std03.consumed" data-kind="state" data-semantic-id="state.std03.consumed" data-state-name="CONSUMED" aria-label="CONSUMED"><rect x="5100" y="1050" width="1250" height="360" rx="34" class="state-box" /><text x="5725" y="1255" class="state-name" text-anchor="middle">CONSUMED</text></g><g id="state.std03.expired" data-kind="state" data-semantic-id="state.std03.expired" data-state-name="EXPIRED" aria-label="EXPIRED"><rect x="5100" y="2300" width="1250" height="360" rx="34" class="state-box" /><text x="5725" y="2505" class="state-name" text-anchor="middle">EXPIRED</text></g><g id="state.std03.released" data-kind="state" data-semantic-id="state.std03.released" data-state-name="RELEASED" aria-label="RELEASED"><rect x="5100" y="3550" width="1250" height="360" rx="34" class="state-box" /><text x="5725" y="3755" class="state-name" text-anchor="middle">RELEASED</text></g><g id="state.std03.final-consumed" data-kind="final" data-semantic-id="state.std03.final-consumed" aria-label="Final pseudostate"><circle cx="6950" cy="1230" r="52" class="final-ring" /><circle cx="6950" cy="1230" r="29" class="initial-node" /></g><g id="state.std03.final-expired" data-kind="final" data-semantic-id="state.std03.final-expired" aria-label="Final pseudostate"><circle cx="6950" cy="2480" r="52" class="final-ring" /><circle cx="6950" cy="2480" r="29" class="initial-node" /></g><g id="state.std03.final-released" data-kind="final" data-semantic-id="state.std03.final-released" aria-label="Final pseudostate"><circle cx="6950" cy="3730" r="52" class="final-ring" /><circle cx="6950" cy="3730" r="29" class="initial-node" /></g></g><g aria-label="Labeled state transitions"><g id="relation.std03.t01" data-kind="transition" data-semantic-id="relation.std03.t01" data-source="state.std03.initial" data-target="state.std03.active" aria-label="create hold [ArrivalGroup is currently bookable] / protect one capacity unit"><polyline points="775,2480 1500,2480" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="480" y="2098" width="1300" height="164" rx="8" class="label-bg" /><text x="1130" y="2144" class="transition-text" text-anchor="middle"><tspan x="1130">create hold [ArrivalGroup is currently</tspan><tspan x="1130" dy="62">bookable] / protect one capacity unit</tspan></text></g></g><g id="relation.std03.t02" data-kind="transition" data-semantic-id="relation.std03.t02" data-source="state.std03.active" data-target="state.std03.consumed" aria-label="confirm full-payment booking [trusted success &amp; hold valid &amp; before group start &amp; release not CANCELLED] / create CONFIRMED Appointment atomically"><polyline points="2750,2400 3300,2400 3300,1230 5100,1230" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="3400" y="976" width="1300" height="288" rx="8" class="label-bg" /><text x="4050" y="1022" class="transition-text" text-anchor="middle"><tspan x="4050">confirm full-payment booking [trusted</tspan><tspan x="4050" dy="62">success &amp; hold valid &amp; before group start</tspan><tspan x="4050" dy="62">&amp; release not CANCELLED] / create</tspan><tspan x="4050" dy="62">CONFIRMED Appointment atomically</tspan></text></g></g><g id="relation.std03.t03" data-kind="transition" data-semantic-id="relation.std03.t03" data-source="state.std03.active" data-target="state.std03.consumed" aria-label="confirm pay-at-facility booking [booking complete &amp; hold valid &amp; before group start &amp; release not CANCELLED] / create CONFIRMED Appointment atomically"><polyline points="2750,2530 3550,2530 3550,1450 4700,1450 4700,1230 5100,1230" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="3490" y="1516" width="1300" height="288" rx="8" class="label-bg" /><text x="4140" y="1562" class="transition-text" text-anchor="middle"><tspan x="4140">confirm pay-at-facility booking [booking</tspan><tspan x="4140" dy="62">complete &amp; hold valid &amp; before group start</tspan><tspan x="4140" dy="62">&amp; release not CANCELLED] / create</tspan><tspan x="4140" dy="62">CONFIRMED Appointment atomically</tspan></text></g></g><g id="relation.std03.t04" data-kind="transition" data-semantic-id="relation.std03.t04" data-source="state.std03.active" data-target="state.std03.expired" aria-label="hold time expires / release protected capacity"><polyline points="2750,2480 5100,2480" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="3294.5" y="2288" width="1291" height="164" rx="8" class="label-bg" /><text x="3940" y="2334" class="transition-text" text-anchor="middle"><tspan x="3940">hold time expires / release protected</tspan><tspan x="3940" dy="62">capacity</tspan></text></g></g><g id="relation.std03.t05" data-kind="transition" data-semantic-id="relation.std03.t05" data-source="state.std03.active" data-target="state.std03.released" aria-label="Patient abandons or cancels booking / release protected capacity"><polyline points="2750,2600 3350,2600 3350,3730 5100,3730" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="3104.5" y="3168" width="1291" height="164" rx="8" class="label-bg" /><text x="3750" y="3214" class="transition-text" text-anchor="middle"><tspan x="3750">Patient abandons or cancels booking /</tspan><tspan x="3750" dy="62">release protected capacity</tspan></text></g></g><g id="relation.std03.t06" data-kind="transition" data-semantic-id="relation.std03.t06" data-source="state.std03.active" data-target="state.std03.released" aria-label="parent release is CANCELLED / release protected capacity"><polyline points="2225,2660 2225,4300 4650,4300 4650,3730 5100,3730" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="2854.5" y="4128" width="1291" height="164" rx="8" class="label-bg" /><text x="3500" y="4174" class="transition-text" text-anchor="middle"><tspan x="3500">parent release is CANCELLED / release</tspan><tspan x="3500" dy="62">protected capacity</tspan></text></g></g><g id="relation.std03.t07" data-kind="transition" data-semantic-id="relation.std03.t07" data-source="state.std03.consumed" data-target="state.std03.final-consumed" aria-label="completion"><polyline points="6350,1230 6898,1230" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="6380" y="1069" width="480" height="102" rx="8" class="label-bg" /><text x="6620" y="1115" class="transition-text" text-anchor="middle"><tspan x="6620">completion</tspan></text></g></g><g id="relation.std03.t08" data-kind="transition" data-semantic-id="relation.std03.t08" data-source="state.std03.expired" data-target="state.std03.final-expired" aria-label="completion"><polyline points="6