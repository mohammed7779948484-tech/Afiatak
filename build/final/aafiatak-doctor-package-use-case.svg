    <rect x="135" y="175" width="220" height="34" class="package-tab" data-semantic-id="actor.doctor" data-kind="actor" data-embedded-actor="true" data-x="135" data-y="175" data-width="1930" data-height="900" />
    <text x="245" y="197" class="boundary-title">
      <tspan x="245" y="197">Doctor</tspan>
    </text>
  </g>
  <g aria-label="Presentation-only neighborhoods">
