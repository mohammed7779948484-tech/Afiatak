<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1200" viewBox="0 0 2200 1200" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Doctor Package Use Case Diagram — Aafiatak Medical Appointment Booking System</title>
  <desc id="diagram-description">Unified Doctor package with all approved operations in one container and no displayed relationships.</desc>
  <defs>
    <style>text { font-family: Arial, Helvetica, sans-serif; fill: #243142; text-anchor: middle; }
.page-title { font-size: 28px; font-weight: 700; }
.boundary-title { font-size: 18px; font-weight: 700; text-anchor: start; }
.section-label { font-size: 14px; font-weight: 700; letter-spacing: 1.2px; text-anchor: start; text-transform: uppercase; }
.use-case-label { font-size: 15px; }
.actor-label { font-size: 14px; font-weight: 600; }
.stereotype { font-size: 13px; font-style: italic; }
.condition { font-size: 11px; fill: #64748B; }
.boundary { fill: none; stroke: #334E68; stroke-width: 2; }
.field { fill: #F4F3EF; opacity: .72; }
.field-accent { stroke-width: 4; stroke-linecap: round; }
.actor { fill: none; stroke: #243142; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.use-case { stroke: #334E68; stroke-width: 1.5; }
.access { fill: #E8F1F8; } .patient { fill: #F8EBCF; }
.facility { fill: #E6F1E8; } .operations { fill: #F5E8DF; }
.doctor { fill: #E8EFF2; } .platform { fill: #ECEAF4; }
.association { fill: none; stroke: #8191A3; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
.dependency { fill: none; stroke: #315F85; stroke-width: 1.6; stroke-dasharray: 7 5; marker-end: url(#dependency-arrow); stroke-linecap: round; stroke-linejoin: round; }
.label-backdrop { fill: #FAFAF8; opacity: .94; }
.package { fill: none; stroke: #334E68; stroke-width: 1.8; }
.package-tab { fill: #F4F3EF; stroke: #334E68; stroke-width: 1.8; }
.helper { fill: #F3F5F6; }
.use-case-label { font-size: 16px; }
.section-label { font-size: 15px; letter-spacing: 0.8px; }
.boundary-title { font-size: 14px; }</style>
  </defs>
  <rect width="2200" height="1200" fill="#FAFAF8" />
  <text x="1100.0" y="48" class="page-title">
    <tspan x="1100.0" y="48">Doctor Package Use Case Diagram — Aafiatak Medical Appointment Booking System</tspan>
