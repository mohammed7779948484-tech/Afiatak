<svg xmlns="http://www.w3.org/2000/svg" width="7500" height="5303" viewBox="0 0 7500 5303" role="img" aria-labelledby="diagram-title diagram-description"><title id="diagram-title">State Diagram — VisitInstance Lifecycle</title><desc id="diagram-description">Lecturer-style UML State Diagram for the VisitInstance lifecycle.</desc><defs><style>
      .page { fill:#FFFFFF; } .page-border { fill:none; stroke:#D9E2EC; stroke-width:2; }
      .page-title { font-family:Arial,sans-serif; font-size:76px; font-weight:700; fill:#132C45; }
      .state-box { fill:#F6F9FC; stroke:#163D59; stroke-width:5; } .state-divider { stroke:#9FB3C8; stroke-width:2.5; }
      .state-name { font-family:Arial,sans-serif; font-size:64px; font-weight:700; fill:#102A43; } .state-activity { font-family:Arial,sans-serif; font-size:46px; font-style:italic; fill:#274C63; }
      .initial-node { fill:#102A43; stroke:#102A43; stroke-width:4; } .final-ring { fill:#FFFFFF; stroke:#102A43; stroke-width:7; }
      .transition-line { fill:none; stroke:#102A43; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
      .label-bg { fill:#FFFFFF; opacity:.98; } .transition-text { font-family:Arial,sans-serif; font-size:44px; font-weight:600; fill:#102A43; }
    </style><marker id="state-arrow" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 15 7 L 0 14 Z" fill="#102A43" /></marker></defs><rect x="0" y="0" width="7500" height="5303" class="page" /><rect x="55" y="55" width="7390" height="5193" rx="14" class="page-border" /><text x="3750" y="185" class="page-title" text-anchor="middle">State Diagram — VisitInstance Lifecycle</text><g aria-label="State lifecycle nodes"><g id="state.std06.initial" data-kind="initial" data-semantic-id="state.std06.initial" aria-label="Initial pseudostate"><circle cx="500" cy="2580" r="38" class="initial-node" /></g><g id="state.std06.created" data-kind="state" data-semantic-id="state.std06.created" data-state-name="CREATED" aria-label="CREATED"><rect x="1100" y="2400" width="1250" height="360" rx="34" class="state-box" /><text x="1725" y="2605" class="state-name" text-anchor="middle">CREATED</text></g><g id="state.std06.checked-in" data-kind="state" data-semantic-id="state.std06.checked-in" data-state-name="CHECKED_IN" aria-label="CHECKED_IN"><rect x="2800" y="2400" width="1250" height="360" rx="34" class="state-box" /><text x="3425" y="2605" class="state-name" text-anchor="middle">CHECKED_IN</text></g><g id="state.std06.in-service" data-kind="state" data-semantic-id="state.std06.in-service" data-state-name="IN_SERVICE" aria-label="IN_SERVICE"><rect x="4500" y="2400" width="1250" height="360" rx="34" class="state-box" /><line x1="4560" y1="2580" x2="5690" y2="2580" class="state-divider" /><text x="5125" y="2538" class="state-name" text-anchor="middle">IN_SERVICE</text><text x="5125" y="2652" class="state-activity" text-anchor="middle"><tspan x="5125">do / service in progress</tspan></text></g><g id="state.std06.completed" data-kind="state" data-semantic-id="state.std06.completed" data-state-name="COMPLETED" aria-label="COMPLETED"><rect x="5700" y="1100" width="1250" height="360" rx="34" class="state-box" /><text x="6325" y="1305" class="state-name" text-anchor="middle">COMPLETED</text></g><g id="state.std06.not-completed" data-kind="state" data-semantic-id="state.std06.not-completed" data-state-name="NOT_COMPLETED" aria-label="NOT_COMPLETED"><rect x="5700" y="3400" width="1250" height="360" rx="34" class="state-box" /><text x="6325" y="3605" class="state-name" text-anchor="middle">NOT_COMPLETED</text></g><g id="state.std06.no-show" data-kind="state" data-semantic-id="state.std06.no-show" data-state-name="NO_SHOW" aria-label="NO_SHOW"><rect x="3100" y="4000" width="1250" height="360" rx="34" class="state-box" /><text x="3725" y="4205" class="state-name" text-anchor="middle">NO_SHOW</text></g><g id="state.std06.final-completed" data-kind="final" data-semantic-id="state.std06.final-completed" aria-label="Final pseudostate"><circle cx="7000" cy="1280" r="52" class="final-ring" /><circle cx="7000" cy="1280" r="29" class="initial-node" /></g><g id="state.std06.final-not-completed" data-kind="final" data-semantic-id="state.std06.final-not-completed" aria-label="Final pseudostate"><circle cx="7000" cy="3580" r="52" class="final-ring" /><circle cx="7000" cy="3580" r="29" class="initial-node" /></g><g id="state.std06.final-no-show" data-kind="final" data-semantic-id="state.std06.final-no-show" aria-label="Final pseudostate"><circle cx="5200" cy="4180" r="52" class="final-ring" /><circle cx="5200" cy="4180" r="29" class="initial-node" /></g></g><g aria-label="Labeled state transitions"><g id="relation.std06.t01" data-kind="transition" data-semantic-id="relation.std06.t01" data-source="state.std06.initial" data-target="state.std06.created" aria-label="first relevant service-day operational event / create VisitInstance"><polyline points="555,2580 1100,2580" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="160" y="2308" width="1300" height="164" rx="8" class="label-bg" /><text x="810" y="2354" class="transition-text" text-anchor="middle"><tspan x="810">first relevant service-day operational</tspan><tspan x="810" dy="62">event / create VisitInstance</tspan></text></g></g><g id="relation.std06.t02" data-kind="transition" data-semantic-id="relation.std06.t02" data-source="state.std06.created" data-target="state.std06.checked-in" aria-label="Reception registers arrival / record arrival and create/activate QueueEntry"><polyline points="2350,2580 2800,2580" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="1925" y="2838" width="1300" height="164" rx="8" class="label-bg" /><text x="2575" y="2884" class="transition-text" text-anchor="middle"><tspan x="2575">Reception registers arrival / record</tspan><tspan x="2575" dy="62">arrival and create/activate QueueEntry</tspan></text></g></g><g id="relation.std06.t03" data-kind="transition" data-semantic-id="relation.std06.t03" data-source="state.std06.created" data-target="state.std06.checked-in" aria-label="Reception accepts late arrival [NO_SHOW not recorded] / record late acceptance and manual queue handling"><polyline points="1725,2400 1725,1700 3425,1700 3425,2400" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="1925" y="1447" width="1300" height="226" rx="8" class="label-bg" /><text x="2575" y="1493" class="transition-text" text-anchor="middle"><tspan x="2575">Reception accepts late arrival [NO_SHOW</tspan><tspan x="2575" dy="62">not recorded] / record late acceptance and</tspan><tspan x="2575" dy="62">manual queue handling</tspan></text></g></g><g id="relation.std06.t04" data-kind="transition" data-semantic-id="relation.std06.t04" data-source="state.std06.created" data-target="state.std06.no-show" aria-label="ArrivalGroup window ends [no valid check-in] / facility staff records no-show"><polyline points="1725,2760 1725,4180 3100,4180" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="1725" y="3798" width="1300" height="164" rx="8" class="label-bg" /><text x="2375" y="3844" class="transition-text" text-anchor="middle"><tspan x="2375">ArrivalGroup window ends [no valid</tspan><tspan x="2375" dy="62">check-in] / facility staff records no-show</tspan></text></g></g><g id="relation.std06.t05" data-kind="transition" data-semantic-id="relation.std06.t05" data-source="state.std06.checked-in" data-target="state.std06.in-service" aria-label="facility staff records service start"><polyline points="4050,2580 4500,2580" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="3646" y="2869" width="1258" height="102" rx="8" class="label-bg" /><text x="4275" y="2915" class="transition-text" text-anchor="middle"><tspan x="4275">facility staff records service start</tspan></text></g></g><g id="relation.std06.t06" data-kind="transition" data-semantic-id="relation.std06.t06" data-source="state.std06.checked-in" data-target="state.std06.not-completed" aria-label="service cannot be completed / record non-completion"><polyline points="3425,2760 3425,3580 5700,3580" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="3931" y="3388" width="1258" height="164" rx="8" class="label-bg" /><text x="4560" y="3434" class="transition-text" text-anchor="middle"><tspan x="4560">service cannot be completed / record</tspan><tspan x="4560" dy="62">non-completion</tspan></text></g></g><g id="relation.std06.t07" data-kind="transition" data-semantic-id="relation.std06.t07" data-source="state.std06.in-service" data-target="state.std06.completed" aria-label="facility staff records operational completion"><polyline points="5125,2400 5125,1280 5700,1280" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="4824" y="1028" width="1192" height="164" rx="8" class="label-bg" /><text x="5420" y="1074" class="transition-text" text-anchor="middle"><tspan x="5420">facility staff records operational</tspan><tspan x="5420" dy="62">completion</tspan></text></g></g><g id="relation.std06.t08" data-kind="transition" data-semantic-id="relation.std06.t08" data-source="state.std06.in-service" data-target="state.std06.not-completed" aria-label="service cannot be completed / record non-completion"><polyline points="5125,2760 5125,3950 6325,3950 6325,3760" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="5096" y="3968" width="1258" height="164" rx="8" class="label-bg" /><text x="5725" y="4014" class="transition-text" text-anchor="middle"><tspan x="5725">service cannot be completed / record</tspan><tspan x="5725" dy="62">non-completion</tspan></text></g></g><g id="relation.std06.t09" data-kind="transition" data-semantic-id="relation.std06.t09" data-source="state.std06.checked-in" data-target="state.std06.created" aria-label="correct erroneous check-in [before service start] / remove QueueEntry and audit reason"><polyline points="3425,2400 3425,2050 2450,2050 2450,2220 2350,2220 2350,2400" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="2270" y="2077" width="1300" height="226" rx="8" class="label-bg" /><text x="2920" y="2123" class="transition-text" text-anchor="middle"><tspan x="2920">correct erroneous check-in [before service</tspan><tspan x="2920" dy="62">start] / remove QueueEntry and audit</tspan><tspan x="2920" dy="62">reason</tspan></text></g></g><g id="relation.std06.t10" data-kind="transition" data-semantic-id="relation.std06.t10" data-source="state.std06.completed" data-target="state.std06.final-completed" aria-label="completion"><polyline points="6950,1280 6948,1280" class="transition-line" marker-end="url(#state-arrow)" /><g class="transition-label"><rect x="6590" y="1119" width="480" height="102" rx="8" class="label-bg" /><text x="6830" y="1165" class="transition-text" text-anchor="middle"><tspan x="6830">completion</tspan></text></g></g><g id="relation.std06.t11" data-kind="transition" data-semantic-id="relation.s