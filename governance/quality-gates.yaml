version: 1
gates:
  Q0: {name: Source Integrity, blocking: true}
  Q1: {name: Schema Validation, blocking: true}
  Q2: {name: Traceability Validation, blocking: true}
  Q3: {name: UML Semantic Validation, blocking: true}
  Q4: {name: Draw.io Structural Validation, blocking: true}
  Q5: {name: Geometry and Routing Validation, blocking: true}
  Q6: {name: Rendered Visual QA, blocking: true, conditional_on_export_tool: true}
  Q7: {name: Approval and Release Readiness, blocking: true}
release:
  target: build/final
  require_all_applicable_gates: true
  require_approval: true
